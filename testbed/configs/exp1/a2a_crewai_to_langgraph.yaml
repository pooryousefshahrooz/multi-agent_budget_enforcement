organizations:
  org_crew:
    framework: crewai
    forward_limit: true
    agents:
      a: {role: 'SCRIPT: delegate_to_org_lg_b {"task": "do the work"}'}
  org_lg:
    framework: langgraph
    agents:
      b: {role: "SCRIPT: answer"}
links:
  - "org_crew.a -> org_lg.b"
