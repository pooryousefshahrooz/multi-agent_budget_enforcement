# Experiment 1, A2A across frameworks, crewai -> langgraph: the sender holds the user's limit and puts it on the A2A message
# (forward_limit); does langgraph's core take it into the receiving run? Generated by make_pair_configs.py.
name: exp1_a2a_crewai_to_langgraph
model: {kind: fake, mode: finite}
request_limit: {max_depth: 3, deadline_s: 600, max_cost_usd: 0.01}
