# Experiment 1, A2A across frameworks, langgraph -> adk: the sender holds the user's limit and puts it on the A2A message
# (forward_limit); does adk's core take it into the receiving run? Generated by make_pair_configs.py.
name: exp1_a2a_langgraph_to_adk
model: {kind: fake, mode: finite}
request_limit: {max_depth: 3, deadline_s: 600, max_cost_usd: 0.01}
limit_conversion: {usd_per_call: 0.001, seconds_per_call: 5}   # a receiver's price per model call (CrewAI patched)
entry_via: native
organizations:
  org_lg:
    framework: langgraph
    forward_limit: true
    agents:
      a: {role: 'SCRIPT: delegate_to_org_adk_b {"task": "do the work"}'}
  org_adk:
    framework: adk
    agents:
      b: {role: "SCRIPT: answer"}
links:
  - "org_lg.a -> org_adk.b"
entry: org_lg.a
