# Experiment 1, A2A across frameworks, openai_agents -> crewai_a2a: the sender holds the user's limit and puts it on the A2A message
# (forward_limit); does crewai_a2a's core take it into the receiving run? Generated by make_pair_configs.py.
name: exp1_a2a_openai_agents_to_crewai_a2a
model: {kind: fake, mode: finite}
request_limit: {max_depth: 3, deadline_s: 600, max_cost_usd: 0.01}
limit_conversion: {usd_per_call: 0.001, seconds_per_call: 5}   # a receiver's price per model call (CrewAI patched)
entry_via: native
organizations:
  org_oa:
    framework: openai_agents
    forward_limit: true
    agents:
      a: {role: 'SCRIPT: delegate_to_org_crewst_b {"task": "do the work"}'}
  org_crewst:
    framework: crewai_a2a
    agents:
      b: {role: "SCRIPT: answer"}
links:
  - "org_oa.a -> org_crewst.b"
entry: org_oa.a
