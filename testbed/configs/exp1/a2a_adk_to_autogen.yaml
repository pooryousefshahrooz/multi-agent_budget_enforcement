# Experiment 1, A2A across frameworks, adk -> autogen: the sender holds the user's limit and puts it on the A2A message
# (forward_limit); does autogen's core take it into the receiving run? Generated by make_pair_configs.py.
name: exp1_a2a_adk_to_autogen
model: {kind: fake, mode: finite}
request_limit: {max_depth: 3, deadline_s: 600, max_cost_usd: 0.01}
limit_conversion: {usd_per_call: 0.001, seconds_per_call: 5}   # a receiver's price per model call (CrewAI patched)

organizations:
  org_adk:
    framework: adk
    forward_limit: true
    agents:
      a: {role: 'SCRIPT: delegate_to_org_ag_b {"task": "do the work"}'}
  org_ag:
    framework: autogen
    agents:
      b: {role: "SCRIPT: answer"}
links:
  - "org_adk.a -> org_ag.b"
entry: org_adk.a
