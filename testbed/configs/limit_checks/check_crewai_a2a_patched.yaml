# Does a patched framework enforce the limit it receives over A2A? langgraph -> crewai_a2a_patched, scripted fake model: the receiver
# calls slow (4 s) twice, then noop twice, then answers (4 tool calls). Its own setting is raised (agent_limit: 20) so only the user's
# limit binds. Levels: high (finishes), budget (2 model calls: stopped by its call limit), depth (no hop left:
# rejected), deadline (6 s: the two slow calls outlive it: cancelled). Generated by make_pair_configs.py.
name: check_langgraph_to_crewai_a2a_patched
model: {kind: fake, mode: finite}
request_limit: {max_depth: 3, deadline_s: 600, max_cost_usd: 1.0}
limit_conversion: {usd_per_call: 0.001, seconds_per_call: 5}   # the receiver's price per model call
entry_via: native
limit_levels:
  high:     {max_depth: 3, deadline_s: 600, max_cost_usd: 1.0}
  budget:   {max_depth: 3, deadline_s: 600, max_cost_usd: 0.002}
  depth:    {max_depth: 1, deadline_s: 600, max_cost_usd: 1.0}
  deadline: {max_depth: 3, deadline_s: 6,   max_cost_usd: 1.0}
mcp_servers:
  probe-tools: {script: mcp_servers/probe_tools.py, env: tasks}
organizations:
  org_lg:
    framework: langgraph
    forward_limit: true
    agents:
      a: {role: 'SCRIPT: delegate_to_org_crewpt_b {"task": "do the work"}'}
  org_crewpt:
    framework: crewai_a2a_patched
    agent_limit: 20
    agents:
      b:
        role: |
          SCRIPT: slow {"seconds": 4}
          SCRIPT: slow {"seconds": 4}
          SCRIPT: noop {"step": 2}
          SCRIPT: noop {"step": 3}
        mcp: [probe-tools]
links:
  - "org_lg.a -> org_crewpt.b"
entry: org_lg.a
