# Per-agent limits do not compose. Tasks with 3 subtasks (DynamicMCPBench) on a chain of 3 organizations over A2A,
# one agent each in its own process, one subtask per hop, the frameworks in turn (langgraph -> adk -> crewai -> openai_agents -> autogen -> ...), each on
# its framework's default limit only (no limit for the whole request). Generated by make_pair_configs.py.
name: composition_k3
model: {kind: openai-compatible, url: "http://127.0.0.1:11434/v1", model: "llama3.2:3b"}
prices: {usd_per_1m_input: 0.15, usd_per_1m_output: 0.60, usd_per_tool_call: 0.0}
request_limit: {max_depth: 100, deadline_s: 7200, max_cost_usd: 100.0}   # attached, never enforced
tasks: {dataset: dynamicmcpbench, servers: [wikipedia, pubmed, eurostat, openlibrary], subtasks: 3, n: 10}
mcp_servers:
  wikipedia: {url: "http://127.0.0.1:9863/mcp", command: [uvx, --from, "wikipedia-mcp==2.0.1", wikipedia-mcp]}
  pubmed: {url: "http://127.0.0.1:9865/mcp", command: [npx, -y, "@cyanheads/pubmed-mcp-server@2.11.1"]}
  eurostat: {url: "http://127.0.0.1:9866/mcp", command: [npx, -y, "@cyanheads/eurostat-mcp-server@0.11.1"]}
  openlibrary: {url: "http://127.0.0.1:9867/mcp", command: [npx, -y, "@cyanheads/openlibrary-mcp-server@0.4.0"]}
organizations:
  org1_lg:
    framework: langgraph
    agents:
      a: {role: "You are agent 1 of a chain of 3 agents; the task has 3 subtasks. Do subtask 1 with your tools, then delegate the remaining subtasks to the next agent with your delegate tool, passing on everything found so far. Then report the result you get back.", mcp: [wikipedia, pubmed, eurostat, openlibrary]}
  org2_adk:
    framework: adk
    agents:
      a: {role: "You are agent 2 of a chain of 3 agents; the task has 3 subtasks. Do subtask 2 with your tools, then delegate the remaining subtasks to the next agent with your delegate tool, passing on everything found so far. Then report the result you get back.", mcp: [wikipedia, pubmed, eurostat, openlibrary]}
  org3_crew:
    framework: crewai
    agents:
      a: {role: "You are the last agent of a chain of 3 agents; the task has 3 subtasks. Do the last subtask with your tools and give the final result of the whole task.", mcp: [wikipedia, pubmed, eurostat, openlibrary]}
links:
  - "org1_lg.a -> org2_adk.a"
  - "org2_adk.a -> org3_crew.a"
entry: org1_lg.a
