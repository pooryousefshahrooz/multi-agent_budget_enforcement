# GAIA under the user's limit, openai_agents -> adk: an agent in the openai_agents organization delegates each task to an agent in the
# adk organization (A2A). The receiver applies the limit it received with its framework's own counter (apply_limit:
# calls); the sender only forwards it. Generated by make_pair_configs.py.
name: gaia_openai_agents_to_adk
model: {kind: openai-compatible, url: "http://127.0.0.1:11434/v1", model: "llama3.2:3b"}
prices: {usd_per_1m_input: 0.15, usd_per_1m_output: 0.60, usd_per_tool_call: 0.0}
limit_conversion: {usd_per_call: 0.001, seconds_per_call: 5}     # the user's limit -> model calls
request_limit: {max_depth: 3, deadline_s: 900, max_cost_usd: 0.010}
entry_via: native
limit_levels:
  cannot: {max_depth: 3, deadline_s: 900, max_cost_usd: 0.001}   # 1 model call
  can:    {max_depth: 3, deadline_s: 900, max_cost_usd: 0.010}   # 10 model calls
  high:   {max_depth: 3, deadline_s: 3600, max_cost_usd: 1.0}   # 1000 model calls
  # only one limit binds, the other two are generous
  depth:    {max_depth: 1, deadline_s: 3600, max_cost_usd: 1.0}    # the sender's hop leaves 0: the receiver refuses
  deadline: {max_depth: 3, deadline_s: 10,   max_cost_usd: 1.0}    # ~1 model call of time left
  cost:     {max_depth: 3, deadline_s: 3600, max_cost_usd: 0.001}  # 1 model call
tasks:
  dataset: gaia
  ids: [4fc2f1ae-8625-45b5-ab34-ad4433bc21f8, 5a0c1adf-205e-4841-a666-7c3ef95def9d, a0c07678-e491-4bbc-8f0b-07405144218f,
        8e867cd7-cff9-4e6c-867a-ff5ddc2550be, c365c1c7-a3db-4d5e-a9a1-66f56eae7865, e1fc63a2-da7a-432f-be78-7c4a95598703,
        305ac316-eef6-4446-960a-92d80d542f82, 3f57289b-8c60-48be-bd80-01f8099ca449, 2d83110e-a098-4ebb-9987-066c06fa42d0,
        3cef3a44-215e-4aed-8e3b-b1e3f08063b7]
mcp_servers:                                                 # MCP-Atlas's servers and pins, stdio behind mcp-proxy
  wikipedia:  {url: "http://127.0.0.1:9863/mcp", command: [uvx, --from, "wikipedia-mcp==2.0.1", wikipedia-mcp]}
  calculator: {url: "http://127.0.0.1:9864/mcp", command: [uvx, --with, "mcp<2", "mcp-server-calculator==0.2.0"]}
organizations:
  org_oa:
    framework: openai_agents
    forward_limit: true
    agents:
      a: {role: "You coordinate. Always delegate the question to the research agent of the partner organization with your delegate tool, then report its answer. Finish with the line 'FINAL ANSWER: <answer>'."}
  org_adk:
    framework: adk
    apply_limit: calls
    agents:
      b: {role: "You are a researcher. Use your Wikipedia and calculator tools to answer the question. Finish with the line 'FINAL ANSWER: <answer>'.", mcp: [wikipedia, calculator]}
links:
  - "org_oa.a -> org_adk.b"
entry: org_oa.a
