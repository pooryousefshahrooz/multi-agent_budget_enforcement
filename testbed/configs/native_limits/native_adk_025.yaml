# adk's own limit, max_llm_calls = 25, on a 3-agent organization that delegates natively (planner -> researcher
# -> solver, adk's own multi-agent mechanism, one process). Generated by make_pair_configs.py.
name: native_adk_25
model: {kind: openai-compatible, url: "http://127.0.0.1:11434/v1", model: "llama3.2:3b"}
prices: {usd_per_1m_input: 0.15, usd_per_1m_output: 0.60, usd_per_tool_call: 0.0}
request_limit: {max_depth: 3, deadline_s: 3600, max_cost_usd: 1.0}
tasks:
  dataset: gaia
  ids: [4fc2f1ae-8625-45b5-ab34-ad4433bc21f8, 5a0c1adf-205e-4841-a666-7c3ef95def9d, a0c07678-e491-4bbc-8f0b-07405144218f,
        8e867cd7-cff9-4e6c-867a-ff5ddc2550be, c365c1c7-a3db-4d5e-a9a1-66f56eae7865, e1fc63a2-da7a-432f-be78-7c4a95598703,
        305ac316-eef6-4446-960a-92d80d542f82, 3f57289b-8c60-48be-bd80-01f8099ca449, 2d83110e-a098-4ebb-9987-066c06fa42d0,
        3cef3a44-215e-4aed-8e3b-b1e3f08063b7]
mcp_servers:
  wikipedia:  {url: "http://127.0.0.1:9863/mcp", command: [uvx, --from, "wikipedia-mcp==2.0.1", wikipedia-mcp]}
  calculator: {url: "http://127.0.0.1:9864/mcp", command: [uvx, --with, "mcp<2", "mcp-server-calculator==0.2.0"]}
organizations:
  org_adk:
    framework: adk
    delegation: native
    mechanism: sequential
    native_limit: 25       # adk's own max_llm_calls
    agents:
      planner:    {role: "You plan. Restate the question and list the facts that must be found and the steps to compute the answer. Do not answer it yourself."}
