      solver:     {role: "You solve. Use the facts found and your calculator tools to compute the answer. Finish with the line 'FINAL ANSWER: <answer>'.", mcp: [calculator]}
    edges:
      - "planner -> researcher"
      - "researcher -> solver"
entry: org_adk.planner
